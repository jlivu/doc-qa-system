services:

  api:
    build: .
    container_name: doc-qa-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./sample_docs:/app/sample_docs:ro
      - uploads:/app/uploads
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: doc-qa-qdrant
    ports:
      - "6333:6333" # HTTP / REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: doc-qa-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
      - HOME=/tmp
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_storage:
  uploads:
